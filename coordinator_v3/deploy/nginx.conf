# Include in the nginx http context. Set the real hostname and trusted certificate.
limit_req_zone $binary_remote_addr zone=v3_worker_rate:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=v3_worker_ip:1m;
limit_conn_zone $server_name zone=v3_worker_total:1m;

server {
    listen 443 ssl;
    server_name coordinator.example.org;
    ssl_certificate /etc/ssl/coordinator/fullchain.pem;
    ssl_certificate_key /etc/ssl/coordinator/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;

    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;

    location ~ ^/v1/(register|claim|heartbeat|complete)$ {
        limit_except POST { deny all; }
        if ($args != "") { return 404; }
        limit_req zone=v3_worker_rate burst=12 nodelay;
        limit_req_status 429;
        limit_conn v3_worker_ip 4;
        limit_conn v3_worker_total 16;
        limit_conn_status 429;
        proxy_request_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        proxy_pass http://127.0.0.1:8763;
    }
    location / { return 404; }
}

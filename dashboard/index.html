<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Работа агентов · ЮКасса</title>
<style>
*{box-sizing:border-box}body{background:#f3f4f0;color:#172d29;margin:0;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:5vw}header,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(34px,6vw,74px);letter-spacing:-.065em;margin:0}button,select{font:inherit;border:1px solid #b3c5bf;border-radius:8px;padding:8px;background:white;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-top:22px}article{background:white;padding:20px;border-top:4px solid #438474;border-radius:6px;overflow-wrap:anywhere}article[data-phase="блокировка"]{border-color:#b45f32}a{color:#175e53}h2{font-size:20px;line-height:1.25}p{margin:.5em 0}small{color:#526863}
</style><main><header><h1>Работа агентов</h1><button id="refresh">Обновить</button></header>
<p id="health" role="status">Загрузка карточек…</p><div class="tools"><label>Статус <select id="phase"><option value="">Все</option></select></label><span id="count"></span></div><section class="grid" id="cards"></section></main>
<script>
const repo='cryptospacerus-maker/forY-cassa-';
const local=location.protocol==='http:' && location.hostname==='127.0.0.1';
const statuses=['очередь','в работе','блокировка','проверка','готово','закрыта','без статуса'];
let issues=[], last='';
function field(issue,key){const prefix=key.toLowerCase()+':';const line=(issue.body||'').split(/\r?\n/).find(l=>l.toLowerCase().startsWith(prefix));return line?.slice(prefix.length).trim()||''}
function status(issue){return field(issue,'Статус').toLowerCase()||(issue.state==='closed'?'закрыта':'без статуса')}
function el(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
for(const s of statuses)phase.add(new Option(s,s));
function linked(node,value){for(const t of value.split(/(https:\/\/[^\s<>]+|#\d+)/g)){if(t.startsWith('https://')||/^#\d+$/.test(t)){const a=el('a',t);a.href=t.startsWith('#')?'https://github.com/'+repo+'/issues/'+t.slice(1):t;node.append(a)}else node.append(t)}}
function render(){cards.replaceChildren();const visible=issues.filter(i=>!phase.value||phase.value===status(i));count.textContent='Карточек: '+visible.length;
for(const i of visible){const card=el('article','');card.dataset.phase=status(i);card.append(el('small','#'+i.number+' · '+status(i)));const title=el('h2',''),a=el('a',i.title);a.href='https://github.com/'+repo+'/issues/'+i.number;title.append(a);card.append(title);
const owner=field(i,'Исполнитель')||(i.assignees||[]).map(x=>x.login).join(', ')||(i.body||'').match(/^Исполнитель — ([^.]+)/)?.[1]||'не указан';card.append(el('p','Исполнитель: '+owner));
for(const k of ['Требование','Версия кейса','Зависимости','Как проверить','Результат']){const v=field(i,k);if(v){const p=el('p',k+': ');linked(p,v);card.append(p)}}cards.append(card)}}
async function sync(){if(refresh.disabled)return;refresh.disabled=true;try{let next=[];for(let page=1;;page++){const url=local?'/issues?page='+page:'https://api.github.com/repos/'+repo+'/issues?state=all&sort=updated&per_page=100&page='+page;const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();next.push(...data.filter(i=>!i.pull_request));if(data.length<100)break}issues=next;last=new Date().toLocaleTimeString('ru');render();health.textContent='Сверено с GitHub в '+last+' · обновление каждые 2 минуты'}catch(e){health.textContent='Нет обновления ('+e.message+'). '+(last?'Показаны данные на '+last:'Проверьте доступ к GitHub. Для закрытого репозитория используйте serve.py.')}finally{refresh.disabled=false}}
phase.onchange=render;refresh.onclick=sync;sync();setInterval(sync,120000);
</script></html>

<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Работа агентов · ЮКасса</title>
<style>
*{box-sizing:border-box}body{background:#f3f4f0;color:#172d29;margin:0;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:5vw}header,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(34px,6vw,74px);letter-spacing:-.065em;margin:0}button,select{font:inherit;border:1px solid #b3c5bf;border-radius:8px;padding:8px;background:white;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-top:22px}article{background:white;padding:20px;border-top:4px solid #438474;border-radius:6px;overflow-wrap:anywhere}article[data-phase="блокировка"]{border-color:#b45f32}a{color:#175e53}h2{font-size:20px;line-height:1.25}p{margin:.5em 0}small{color:#526863}
nav{display:flex;gap:18px;margin:20px 0 32px;flex-wrap:wrap}main>h2{font-size:30px;margin-top:40px}.face{font-size:42px;background:#e7efe4;border-radius:18px;padding:8px;display:inline-block}summary{cursor:pointer}details{border-top:1px solid #dbe4df;padding-top:6px;margin-top:8px}#feed{max-height:560px;overflow:auto;display:grid;gap:10px}#feed article{border:0;border-left:4px solid #438474}#feed small{display:block}.message{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><header><h1>Работа агентов</h1><button id="refresh">Обновить</button></header>
<p id="health" role="status">Загрузка карточек…</p><nav><a href="#agents">Агенты</a><a href="#chat">Чат команды</a><a href="#tasks">Все задачи</a></nav><h2 id="agents">Команда агентов</h2><section class="grid" id="team"></section><h2 id="chat">Чат команды</h2><p>Комментарии и передачи из карточек GitHub. Чтобы ответить, откройте ссылку под сообщением.</p><section id="feed"></section><h2 id="tasks">Все задачи</h2><div class="tools"><label>Статус <select id="phase"><option value="">Все</option></select></label><span id="count"></span></div><section class="grid" id="cards"></section></main>
<script>
const repo='cryptospacerus-maker/forY-cassa-';
const local=location.protocol==='http:' && location.hostname==='127.0.0.1';
const statuses=['очередь','в работе','блокировка','проверка','готово','закрыта','без статуса'];
let issues=[], last='';
function field(issue,key){const prefix=key.toLowerCase()+':';const line=(issue.body||'').split(/\r?\n/).find(l=>l.toLowerCase().startsWith(prefix));return line?.slice(prefix.length).trim()||''}
function status(issue){return field(issue,'Статус').toLowerCase()||(issue.state==='closed'?'закрыта':'без статуса')}
function el(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
for(const s of statuses)phase.add(new Option(s,s));
function linked(node,value){for(const t of value.split(/(https:\/\/[^\s<>]+|#\d+)/g)){if(t.startsWith('https://')||/^#\d+$/.test(t)){const a=el('a',t);a.href=t.startsWith('#')?'https://github.com/'+repo+'/issues/'+t.slice(1):t;node.append(a)}else node.append(t)}}
function render(){cards.replaceChildren();const visible=issues.filter(i=>!phase.value||phase.value===status(i));count.textContent='Карточек: '+visible.length;
for(const i of visible){const card=el('article','');card.dataset.phase=status(i);card.append(el('small','#'+i.number+' · '+status(i)));const title=el('h2',''),a=el('a',i.title);a.href='https://github.com/'+repo+'/issues/'+i.number;title.append(a);card.append(title);
const owner=field(i,'Исполнитель')||(i.assignees||[]).map(x=>x.login).join(', ')||(i.body||'').match(/^Исполнитель — ([^.]+)/)?.[1]||'не указан';card.append(el('p','Исполнитель: '+owner));
for(const k of ['Требование','Версия кейса','Зависимости','Как проверить','Результат']){const v=field(i,k);if(v){const p=el('p',k+': ');linked(p,v);card.append(p)}}cards.append(card)}}
const roles = [
 ['coordinator','🧑🏽‍💼','Координатор','Принимает кейс, согласует зависимости и собирает общий результат.'],
 ['analyst','👩🏻‍💼','Бизнес-аналитик','Уточняет потребность бизнеса и готовит контрольные примеры.'],
 ['developer','👨🏾‍💻','Разработчик агента','Реализует логику, инструменты и интеграции.'],
 ['interface','👩🏼‍🎨','Разработчик интерфейса','Собирает экраны и путь пользователя для демонстрации.'],
 ['tester','🧑🏻‍🔬','Тестировщик','Проверяет результат независимо и фиксирует отклонения.']
];
const team=document.querySelector('#team'), feed=document.querySelector('#feed');
let messages=[];
function roleOf(item){return field(item,'Профиль').toLowerCase()}
function issueNumber(message){return Number(message.issue_url.split('/').pop())}
function renderTeam(){
 team.replaceChildren();feed.replaceChildren();
 const known=new Map(issues.map(i=>[i.number,i]));
 const log=messages.filter(m=>known.has(issueNumber(m)));
 for(const [id,face,name,description] of roles){
  const card=el('article',''), avatar=el('span',face);
  avatar.className='face';avatar.setAttribute('aria-hidden','true');
  const profile=el('a','Полный профиль ↗');
  profile.href='https://github.com/'+repo+'/blob/workspace/case-control/agents/'+id+'.md';
  card.append(avatar,el('h2',name),el('p',description),profile);
  const current=issues.filter(i=>roleOf(i)===id);
  const completed=i=>i.state==='closed'||status(i)==='готово';
  const previous=new Set(log.filter(m=>roleOf(m)===id).map(issueNumber));
  for(const [label,items] of [['Назначены',current.filter(i=>!completed(i))],['Завершены',current.filter(completed)],['Участвовал ранее',issues.filter(i=>previous.has(i.number)&&roleOf(i)!==id)]]){
   const group=el('details','');group.open=items.length>0;
   group.append(el('summary',label+' · '+items.length));
   for(const i of items){const p=el('p','');linked(p,'#'+i.number+' '+i.title);group.append(p)}
   card.append(group)
  }
  team.append(card)
 }
 for(const m of log.slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))){
  const n=issueNumber(m),role=roles.find(r=>r[0]===roleOf(m)),to=field(m,'Кому');
  const entry=el('article',''),source=el('a','#'+n+' · '+known.get(n).title);
  source.href=m.html_url;entry.append(el('strong',(role?role[1]+' '+role[2]+' · ':'')+m.user.login));
  if(to)entry.append(el('b',' → '+(roles.find(r=>r[0]===to)?.[2]||to)));
  const body=el('p',m.body);body.className='message';
  entry.append(el('small',new Date(m.created_at).toLocaleString('ru')),body,source);feed.append(entry)
 }
 if(!log.length)feed.append(el('p',last?'Комментариев в карточках пока нет.':'Ожидание данных GitHub.'));
}
async function allPages(path,query){
 const items=[];
 for(let page=1;;page++){
  const base=local?'/'+path:'https://api.github.com/repos/'+repo+'/'+(path==='comments'?'issues/comments':path);
  const res=await fetch(base+'?'+query+'&per_page=100&page='+page,{cache:'no-store'});
  if(!res.ok)throw Error('HTTP '+res.status);
  const batch=await res.json();items.push(...batch);
  if(batch.length<100)return items;
 }
}
async function sync(){
 if(refresh.disabled)return;refresh.disabled=true;
 try{
  const [tasks,comments]=await Promise.all([allPages('issues','state=all&sort=updated'),allPages('comments','sort=created&direction=desc')]);
  issues=tasks.filter(i=>!i.pull_request);messages=comments;last=new Date().toLocaleTimeString('ru');
  render();renderTeam();health.textContent='Сверено с GitHub в '+last+' · обновление каждые 2 минуты';
 }catch(error){health.textContent='Нет обновления ('+error.message+'). '+(last?'Показаны данные на '+last:'Для закрытого репозитория запустите serve.py.')}
 finally{refresh.disabled=false}
}
renderTeam();
phase.onchange=render;refresh.onclick=sync;sync();setInterval(sync,120000);
</script></html>

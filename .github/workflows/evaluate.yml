name: Судья — независимая оценка
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер карточки для отчёта'
        required: true
      target_sha:
        description: 'Полный SHA оцениваемого коммита'
        required: true
      track:
        type: choice
        options: [business, integrator]
        required: true
      case_version:
        description: 'Версия требований кейса'
        required: true
      evidence_manifest_path:
        description: 'Манифест в оцениваемом коммите'
        default: evaluation/evidence/manifest.json
        required: true
      request_id:
        description: 'Уникальный ID команды, латиница/цифры/_/-'
        required: true
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
        required: true
permissions:
  contents: read
concurrency:
  group: judge-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r evaluation/requirements.txt
      - run: python -m scripts.evaluator.prepare
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGE_ALLOWED_ACTORS: ${{ vars.JUDGE_ALLOWED_ACTORS }}
      - uses: actions/upload-artifact@v4
        with:
          name: judge-input
          path: judge-input/
          retention-days: 30
  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: judge-input
          path: judge-input
      - run: pip install -r evaluation/requirements.txt
      - name: Evaluate exact Git objects without checking out target code
        run: |
          if [ "$JUDGE_MODE" = "dry-run" ]; then
            python -m scripts.evaluator.run --request judge-input/request.json --context judge-input/context.json --output judge-output --dry-run
          else
            python -m scripts.evaluator.run --request judge-input/request.json --context judge-input/context.json --output judge-output
          fi
        env:
          JUDGE_MODE: ${{ inputs.mode }}
          OPENAI_API_KEY: ${{ inputs.mode == 'live' && secrets.JUDGE_OPENAI_API_KEY || '' }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          JUDGE_MAX_USD: ${{ vars.JUDGE_MAX_USD }}
          JUDGE_INPUT_USD_PER_MILLION: ${{ vars.JUDGE_INPUT_USD_PER_MILLION }}
          JUDGE_OUTPUT_USD_PER_MILLION: ${{ vars.JUDGE_OUTPUT_USD_PER_MILLION }}
          JUDGE_PRICING_VERIFIED_ON: ${{ vars.JUDGE_PRICING_VERIFIED_ON }}
          JUDGE_MAX_OUTPUT_TOKENS: '6000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-report
          path: judge-output/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: [prepare, evaluate]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: judge-input
          path: judge-input
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: judge-report
          path: judge-output
      - run: python -m scripts.evaluator.publish
        env:
          GH_TOKEN: ${{ github.token }}

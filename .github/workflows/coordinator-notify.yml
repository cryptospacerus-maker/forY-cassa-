name: Coordinator failure notification

on:
  workflow_run:
    workflows: [Coordinator MVP]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: coordinator-notify-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m coordinator.notify
        env:
          GH_TOKEN: ${{ github.token }}
